# GitHub Pages · publica site/ como landing
#
# Estático, sin build: sube site/ como artifact de Pages y lo despliega.
# Requiere Pages con fuente "GitHub Actions" (se configura una vez;
# settings.pages.build_type=workflow vía API o en Settings → Pages).

name: Pages · landing

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
