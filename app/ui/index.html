<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>WiniOS Studio</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 1024 1024"><use href="assets/icon.svg#w"/></svg>
      <span class="brand-name">WiniOS Studio</span>
    </div>
    <div class="topbar-context">
      <div class="ctx-group" role="group" aria-label="Proyecto y dispositivo">
        <select id="project-select" class="chip" aria-label="Proyecto activo" title="Proyecto activo"></select>
        <button id="device-chip" class="chip chip-dev" aria-label="Estado del iPhone">
          <span class="dev-dot" aria-hidden="true"></span>
          <span id="device-chip-name" data-i18n="noDevice">Sin iPhone</span>
        </button>
      </div>
      <button id="btn-vscode" class="chip chip-code" type="button" data-i18n-title="openVscode" aria-label="Abrir en VS Code">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 4.6 2 8l3.2 3.4M10.8 4.6 14 8l-3.2 3.4M9.4 3.2 6.6 12.8"/></svg>
        <span id="btn-vscode-label" data-i18n="openVscode">Abrir en VS Code</span>
      </button>
      <button id="btn-run" class="primary" data-i18n="run">Ejecutar en mi iPhone</button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" aria-label="Navegación">
      <button data-view="home" class="rail-item active">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8 8 2l6.5 6M3.2 7.2v6.3h3.3v-3.8h3v3.8h3.3V7.2"/></svg>
        <span data-i18n-nav="home">Inicio</span>
      </button>
      <button data-view="projects" class="rail-item">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5 8 1.5l6 3-6 3zM2 8l6 3 6-3M2 11.5l6 3 6-3"/></svg>
        <span data-i18n-nav="projects">Proyectos</span>
      </button>
      <button data-view="devices" class="rail-item">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4.5" y="1.5" width="7" height="13" rx="1.4"/><path d="M7 12.9h2"/></svg>
        <span data-i18n-nav="devices">Dispositivos</span>
      </button>
      <button data-view="activity" class="rail-item">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8.5h3.2l1.8-5 2.6 9 1.7-4h3.7"/></svg>
        <span data-i18n-nav="activity">Actividad</span>
      </button>
      <button data-view="settings" class="rail-item">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.2h12M2 8h12M2 11.8h12"/><circle cx="5.4" cy="4.2" r="1.5" class="knob"/><circle cx="10.6" cy="8" r="1.5" class="knob"/><circle cx="6.8" cy="11.8" r="1.5" class="knob"/></svg>
        <span data-i18n-nav="settings">Preferencias</span>
      </button>
    </nav>

    <main id="view" class="main"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="dlg-new" class="dlg" aria-labelledby="dlg-new-title">
    <form method="dialog" id="dlg-new-form">
      <h2 id="dlg-new-title" data-i18n="newProj">Crear proyecto nuevo</h2>
      <p class="dlg-hint" data-i18n="dlgHint">SwiftUI · SwiftPM. Solo letras, dígitos, guiones.</p>
      <input id="dlg-new-name" class="textline wide" spellcheck="false" data-i18n-ph="dlgNamePh" placeholder="MiPrimeraApp" />
      <p id="dlg-new-err" class="dlg-err" role="alert" hidden></p>
      <div class="dlg-actions">
        <button value="cancel" class="ghost" formnovalidate data-i18n="cancel">Cancelar</button>
        <button id="dlg-new-ok" value="ok" class="primary" data-i18n="create">Crear</button>
      </div>
    </form>
  </dialog>

  <script src="assets/app.js"></script>
</body>
</html>
